name: Bug report / 问题反馈
description: Report a reproducible installation, recognition, or export problem.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请只提供你有权分享且已脱敏的材料。不要上传完整私密录像、runtime.json、密钥或个人路径。
        Share only material you may publish. Remove names, private paths, and credentials.
  - type: input
    id: version
    attributes:
      label: Version / 版本
      placeholder: v0.2.0-beta.1
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment / 运行环境
      description: Windows version, Python version, CPU/GPU, installation method, display dimensions and layout.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, expected behavior, actual behavior / 复现与结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant redacted evidence / 脱敏后的相关证据
      description: Matching run ID, relevant error excerpt, source-relative times, and a small permitted screenshot if useful. Do not paste your whole state directory.
