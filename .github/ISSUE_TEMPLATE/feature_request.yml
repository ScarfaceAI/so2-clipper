name: Feature request / 功能建议
description: Describe the recording or editing task you want to improve.
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: task
    attributes:
      label: Your task / 你想完成的任务
      description: Explain the input, desired result, and the current obstacle.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and example / 建议与示例
