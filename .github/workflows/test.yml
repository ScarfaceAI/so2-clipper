name: Windows tests and release package

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.0.0
        with:
          python-version: "3.12"

      - name: Ensure FFmpeg is available
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
          }
          ffmpeg -version | Select-Object -First 1
          ffprobe -version | Select-Object -First 1

      - name: Install pinned test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Check source contracts
        run: python tools/check_project_contracts.py

      - name: Check generated install runtime
        run: python tools/sync_skill_runtime.py --check

      - name: Run complete engine regression suite
        run: python test_so2_clipper.py

      - name: Build deterministic public package
        run: python tools/build_skill_zip.py

      - name: Verify package and SHA-256 sidecar
        run: python tools/verify_release.py
